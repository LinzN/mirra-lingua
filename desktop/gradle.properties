# Memory: kept small so the build fits next to Jenkins on the build server. The Kotlin compiler runs inside
# the Gradle process instead of starting its own daemon (which would take another ~2 GB), and at most two
# workers run at once.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.code.style=official

# Default server the app connects to (can be changed on the login screen).
parlaServer=https://parla.mirranet.de
